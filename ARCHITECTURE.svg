<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 28px; font-weight: bold; fill: #1a202c; }
      .subtitle { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; fill: #4a5568; }
      .layer-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #2d3748; text-anchor: middle; }
      .node-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #2d3748; }
      .node-text-bold { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #1a202c; }
      .endpoint-text { font-family: 'Consolas', 'Courier New', monospace; font-size: 10px; fill: #0969da; }
      .arrow { stroke: #718096; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-dashed { stroke: #a0aec0; stroke-width: 1.5; stroke-dasharray: 4; fill: none; marker-end: url(#arrowhead); }
      .arrow-loop { stroke: #805ad5; stroke-width: 1.5; stroke-dasharray: 2; fill: none; marker-end: url(#purple-arrowhead); }
      .legend-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #4a5568; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#718096" />
    </marker>
    <marker id="purple-arrowhead" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#805ad5" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="#f8fafc" />

  <!-- Header -->
  <text x="40" y="50" class="title">JobCopilot AI — Current System Architecture</text>
  <text x="40" y="75" class="subtitle">AI Resume Optimization — End-to-End Data &amp; Agent Flow</text>

  <!-- ==================== LAYER 1: CLIENT ==================== -->
  <rect x="30" y="110" width="180" height="660" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="2" />
  <text x="120" y="135" class="layer-title">1. CLIENT LAYER</text>

  <g transform="translate(45, 170)">
    <rect width="150" height="60" rx="5" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5" />
    <text x="75" y="25" class="node-text-bold" text-anchor="middle">User Interaction</text>
    <text x="75" y="42" class="node-text" text-anchor="middle">Uploads Resume &amp; Job</text>
  </g>

  <g transform="translate(45, 300)">
    <rect width="150" height="80" rx="5" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5" />
    <text x="75" y="25" class="node-text-bold" text-anchor="middle">Web / API Client</text>
    <text x="75" y="45" class="node-text" text-anchor="middle">JSON Payloads &amp;</text>
    <text x="75" y="60" class="node-text" text-anchor="middle">Multipart File Ingestion</text>
  </g>

  <!-- ==================== LAYER 2: API & SECURITY ==================== -->
  <rect x="240" y="110" width="220" height="660" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="2" />
  <text x="350" y="135" class="layer-title">2. API &amp; SECURITY LAYER</text>

  <!-- Auth and Dependency -->
  <g transform="translate(255, 170)">
    <rect width="190" height="90" rx="5" fill="#ffffff" stroke="#0288d1" stroke-width="1.5" />
    <text x="95" y="20" class="node-text-bold" text-anchor="middle">JWT Security Flow</text>
    <text x="95" y="40" class="node-text" text-anchor="middle">OAuth2PasswordBearer</text>
    <text x="95" y="58" class="node-text" text-anchor="middle">get_current_active_user</text>
    <text x="95" y="75" class="node-text" text-anchor="middle">Token Verification</text>
  </g>

  <!-- FastAPI Router -->
  <g transform="translate(255, 310)">
    <rect width="190" height="380" rx="5" fill="#ffffff" stroke="#0288d1" stroke-width="1.5" />
    <text x="95" y="20" class="node-text-bold" text-anchor="middle">FastAPI Router</text>
    <text x="95" y="35" class="node-text" text-anchor="middle" fill="#718096">resume_optimizer.py</text>
    <line x1="15" y1="50" x2="175" y2="50" stroke="#e2e8f0" stroke-width="1" />

    <!-- Endpoints -->
    <text x="15" y="75" class="endpoint-text">POST /optimize</text>
    <text x="15" y="90" class="node-text">Triggers multi-agent optimizer</text>

    <text x="15" y="135" class="endpoint-text">GET /optimization/{id}</text>
    <text x="15" y="150" class="node-text">Fetches specific run details</text>

    <text x="15" y="195" class="endpoint-text">GET /history/{candidate}</text>
    <text x="15" y="210" class="node-text">List of candidate optimization runs</text>

    <text x="15" y="255" class="endpoint-text">GET /best/{candidate}</text>
    <text x="15" y="270" class="node-text">Retrieves highest scoring profile</text>

    <text x="15" y="315" class="endpoint-text">DELETE /optimization/{id}</text>
    <text x="15" y="330" class="node-text">Cascade deletes optimization run</text>
  </g>

  <!-- ==================== LAYER 3: SERVICE LAYER ==================== -->
  <rect x="490" y="110" width="220" height="660" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2" />
  <text x="600" y="135" class="layer-title">3. SERVICE LAYER</text>

  <!-- ResumeOptimizerService -->
  <g transform="translate(505, 170)">
    <rect width="190" height="150" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
    <text x="95" y="25" class="node-text-bold" text-anchor="middle">ResumeOptimizerService</text>
    <text x="95" y="42" class="node-text" text-anchor="middle" fill="#718096">Orchestrator Service</text>
    <line x1="15" y1="55" x2="175" y2="55" stroke="#e2e8f0" stroke-width="1" />
    <text x="15" y="75" class="node-text">• Initiates Optimization Runs</text>
    <text x="15" y="95" class="node-text">• Persists checkpoints &amp; log</text>
    <text x="15" y="115" class="node-text">• Creates tailored versions</text>
    <text x="15" y="135" class="node-text">• Updates completion states</text>
  </g>

  <!-- Profile and Job Services -->
  <g transform="translate(505, 360)">
    <rect width="190" height="120" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
    <text x="95" y="25" class="node-text-bold" text-anchor="middle">CandidateProfileStorageService</text>
    <text x="95" y="45" class="node-text" text-anchor="middle">• Handles master profiles</text>
    <text x="95" y="65" class="node-text">• Manages version history</text>
    <text x="95" y="85" class="node-text">• Activates/deactivates states</text>
  </g>

  <g transform="translate(505, 520)">
    <rect width="190" height="120" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
    <text x="95" y="25" class="node-text-bold" text-anchor="middle">Job Services</text>
    <text x="95" y="42" class="node-text" text-anchor="middle" fill="#718096">JobService &amp; JobAnalysisService</text>
    <line x1="15" y1="52" x2="175" y2="52" stroke="#e2e8f0" stroke-width="1" />
    <text x="15" y="75" class="node-text">• Job Description Ingestion</text>
    <text x="15" y="95" class="node-text">• Extracts skills &amp; roles</text>
  </g>

  <!-- ==================== LAYER 4: AI / AGENT LAYER ==================== -->
  <rect x="740" y="110" width="260" height="660" rx="10" fill="#faf5ff" stroke="#e9d5ff" stroke-width="2" />
  <text x="870" y="135" class="layer-title">4. AI / AGENT LAYER</text>

  <!-- Loop Controller -->
  <g transform="translate(755, 170)">
    <rect width="230" height="80" rx="5" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5" />
    <text x="115" y="25" class="node-text-bold" text-anchor="middle">OptimizationLoopController</text>
    <text x="115" y="45" class="node-text" text-anchor="middle">Coordinates the multi-agent state</text>
    <text x="115" y="60" class="node-text" text-anchor="middle">machine for iterative optimization</text>
  </g>

  <!-- Agents -->
  <g transform="translate(755, 270)">
    <rect width="230" height="60" rx="5" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5" />
    <text x="115" y="22" class="node-text-bold" text-anchor="middle">PlannerAgent</text>
    <text x="115" y="40" class="node-text" text-anchor="middle">Identifies gaps &amp; sequences tasks (max 3)</text>
  </g>

  <g transform="translate(755, 350)">
    <rect width="230" height="60" rx="5" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5" />
    <text x="115" y="22" class="node-text-bold" text-anchor="middle">ResumeRewriteAgent</text>
    <text x="115" y="40" class="node-text" text-anchor="middle">Generates contextual modifications</text>
  </g>

  <g transform="translate(755, 430)">
    <rect width="230" height="60" rx="5" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5" />
    <text x="115" y="22" class="node-text-bold" text-anchor="middle">CriticAgent</text>
    <text x="115" y="40" class="node-text" text-anchor="middle">Audits styles, formatting &amp; length</text>
  </g>

  <g transform="translate(755, 510)">
    <rect width="230" height="60" rx="5" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5" />
    <text x="115" y="22" class="node-text-bold" text-anchor="middle">ResumeValidatorAgent</text>
    <text x="115" y="40" class="node-text" text-anchor="middle">Ensures zero factual hallucinations</text>
  </g>

  <g transform="translate(755, 590)">
    <rect width="230" height="60" rx="5" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5" />
    <text x="115" y="22" class="node-text-bold" text-anchor="middle">ResumeMatcherService</text>
    <text x="115" y="40" class="node-text" text-anchor="middle">Recalculates match scoring index</text>
  </g>

  <!-- Loop Label -->
  <text x="870" y="675" class="node-text-bold" fill="#7e22ce" text-anchor="middle">ITERATIVE OPTIMIZATION LOOP</text>

  <!-- ==================== LAYER 5: REPOSITORIES ==================== -->
  <rect x="1030" y="110" width="220" height="660" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
  <text x="1140" y="135" class="layer-title">5. REPOSITORY LAYER</text>

  <g transform="translate(1045, 170)">
    <rect width="190" height="60" rx="5" fill="#ffffff" stroke="#475569" stroke-width="1.5" />
    <text x="95" y="25" class="node-text-bold" text-anchor="middle">OptimizationRepository</text>
    <text x="95" y="42" class="node-text" text-anchor="middle">Manages runs &amp; checkpoints</text>
  </g>

  <g transform="translate(1045, 270)">
    <rect width="190" height="60" rx="5" fill="#ffffff" stroke="#475569" stroke-width="1.5" />
    <text x="95" y="25" class="node-text-bold" text-anchor="middle">CandidateProfileRepository</text>
    <text x="95" y="42" class="node-text" text-anchor="middle">Manages profiles &amp; resumes</text>
  </g>

  <g transform="translate(1045, 370)">
    <rect width="190" height="60" rx="5" fill="#ffffff" stroke="#475569" stroke-width="1.5" />
    <text x="95" y="25" class="node-text-bold" text-anchor="middle">JobRepository</text>
    <text x="95" y="42" class="node-text" text-anchor="middle">Manages target job specs</text>
  </g>

  <g transform="translate(1045, 470)">
    <rect width="190" height="60" rx="5" fill="#ffffff" stroke="#475569" stroke-width="1.5" />
    <text x="95" y="25" class="node-text-bold" text-anchor="middle">AnalysisRepository</text>
    <text x="95" y="42" class="node-text" text-anchor="middle">Stores parsed requirements</text>
  </g>

  <g transform="translate(1045, 570)">
    <rect width="190" height="60" rx="5" fill="#ffffff" stroke="#475569" stroke-width="1.5" />
    <text x="95" y="25" class="node-text-bold" text-anchor="middle">UserRepository</text>
    <text x="95" y="42" class="node-text" text-anchor="middle">Handles candidate accounts</text>
  </g>

  <!-- ==================== LAYER 6: DATABASE ==================== -->
  <rect x="1280" y="110" width="290" height="660" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="2" />
  <text x="1425" y="135" class="layer-title">6. DATABASE / PERSISTENCE</text>

  <!-- Run Model -->
  <g transform="translate(1295, 170)">
    <rect width="260" height="150" rx="5" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" />
    <text x="130" y="25" class="node-text-bold" text-anchor="middle">OptimizationRunModel (runs)</text>
    <line x1="15" y1="38" x2="245" y2="38" stroke="#e2e8f0" stroke-width="1" />
    <text x="20" y="55" class="node-text">id: UUID (PK)</text>
    <text x="20" y="70" class="node-text">candidate_profile_id: UUID (FK)</text>
    <text x="20" y="85" class="node-text">job_profile_id: UUID (FK)</text>
    <text x="20" y="100" class="node-text">status: String ("RUNNING", "SUCCESS")</text>
    <text x="20" y="118" class="node-text" fill="#ef4444" font-weight="bold">ON DELETE CASCADE (Active relationships)</text>
  </g>

  <!-- Iteration Model -->
  <g transform="translate(1295, 340)">
    <rect width="260" height="90" rx="5" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" />
    <text x="130" y="22" class="node-text-bold" text-anchor="middle">OptimizationIterationModel</text>
    <text x="130" y="38" class="node-text" text-anchor="middle" fill="#718096">table: optimization_iterations</text>
    <line x1="15" y1="48" x2="245" y2="48" stroke="#e2e8f0" stroke-width="1" />
    <text x="20" y="65" class="node-text">run_id: UUID (FK) | iteration_number: Int</text>
    <text x="20" y="80" class="node-text">pre_score: Numeric | post_score: Numeric</text>
  </g>

  <!-- History Model -->
  <g transform="translate(1295, 450)">
    <rect width="260" height="80" rx="5" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" />
    <text x="130" y="22" class="node-text-bold" text-anchor="middle">OptimizationHistoryModel</text>
    <text x="130" y="38" class="node-text" text-anchor="middle" fill="#718096">table: optimization_histories</text>
    <line x1="15" y1="46" x2="245" y2="46" stroke="#e2e8f0" stroke-width="1" />
    <text x="20" y="63" class="node-text">run_id: UUID (FK) | total_iterations: Int</text>
  </g>

  <!-- User / Profile / Resume / Job Models -->
  <g transform="translate(1295, 550)">
    <rect width="260" height="200" rx="5" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" />
    <text x="130" y="20" class="node-text-bold" text-anchor="middle">Primary Domain Models</text>
    <line x1="15" y1="30" x2="245" y2="30" stroke="#e2e8f0" stroke-width="1" />
    <text x="20" y="50" class="node-text-bold">• UserModel (users table)</text>
    <text x="20" y="70" class="node-text-bold">• CandidateProfileModel (candidate_profiles)</text>
    <text x="20" y="90" class="node-text-bold">• ResumeModel (resumes)</text>
    <text x="20" y="110" class="node-text-bold">• JobModel (jobs)</text>
    <text x="20" y="130" class="node-text-bold">• JobAnalysisModel (job_analyses)</text>
  </g>


  <!-- ==================== FLOW ARROWS ==================== -->

  <!-- Client to API -->
  <path d="M 195 340 L 255 340" class="arrow" />

  <!-- API to Service -->
  <path d="M 445 340 L 505 340" class="arrow" />

  <!-- Services to Loop Controller -->
  <path d="M 695 210 L 755 210" class="arrow" />

  <!-- Agents Flow inside Purple Container -->
  <path d="M 870 250 L 870 270" class="arrow" />
  <path d="M 870 330 L 870 350" class="arrow" />
  <path d="M 870 410 L 870 430" class="arrow" />
  <path d="M 870 490 L 870 510" class="arrow" />
  <path d="M 870 570 L 870 590" class="arrow" />

  <!-- Purple Loop Arrow (from Matcher back to Controller) -->
  <path d="M 985 620 C 1020 620, 1020 210, 985 210" class="arrow-loop" />

  <!-- Services to Repositories -->
  <path d="M 695 245 L 1045 200" class="arrow-dashed" />
  <path d="M 695 420 L 1045 300" class="arrow-dashed" />
  <path d="M 695 580 L 1045 400" class="arrow-dashed" />

  <!-- Repositories to Database -->
  <path d="M 1235 200 L 1295 200" class="arrow" />
  <path d="M 1235 300 L 1295 580" class="arrow" />
  <path d="M 1235 400 L 1295 620" class="arrow" />
  <path d="M 1235 500 L 1295 640" class="arrow" />
  <path d="M 1235 600 L 1295 560" class="arrow" />

  <!-- Run Model Cascade Deletion Flow -->
  <path d="M 1425 320 L 1425 340" class="arrow" />
  <path d="M 1425 430 L 1425 450" class="arrow" />


  <!-- ==================== LAYER 7: TESTING ==================== -->
  <rect x="30" y="790" width="1540" height="150" rx="10" fill="#efebe9" stroke="#d7ccc8" stroke-width="2" />
  <text x="75" y="815" class="layer-title" style="text-anchor: start;">7. TESTING FRAMEWORK (Dark Neutral)</text>

  <g transform="translate(45, 835)">
    <rect width="180" height="85" rx="5" fill="#ffffff" stroke="#5d4037" stroke-width="1.5" />
    <text x="90" y="25" class="node-text-bold" text-anchor="middle">Pytest Core Suite</text>
    <text x="90" y="45" class="node-text" text-anchor="middle" fill="#16a34a" font-weight="bold">269 Tests Passing (100%)</text>
    <text x="90" y="65" class="node-text" text-anchor="middle">Isolated DB transactions</text>
  </g>

  <g transform="translate(255, 835)">
    <rect width="220" height="85" rx="5" fill="#ffffff" stroke="#5d4037" stroke-width="1.5" />
    <text x="110" y="25" class="node-text-bold" text-anchor="middle">E2E Verification (Phase 6)</text>
    <text x="110" y="42" class="node-text" text-anchor="middle">test_phase6_e2e.py</text>
    <text x="110" y="60" class="node-text" text-anchor="middle">Simulates full user journey flow</text>
  </g>

  <g transform="translate(505, 835)">
    <rect width="220" height="85" rx="5" fill="#ffffff" stroke="#5d4037" stroke-width="1.5" />
    <text x="110" y="25" class="node-text-bold" text-anchor="middle">API &amp; Endpoint Tests</text>
    <text x="110" y="42" class="node-text" text-anchor="middle">test_resume_optimizer_api.py</text>
    <text x="110" y="60" class="node-text" text-anchor="middle">Asserts telemetry format validation</text>
  </g>

  <g transform="translate(755, 835)">
    <rect width="230" height="85" rx="5" fill="#ffffff" stroke="#5d4037" stroke-width="1.5" />
    <text x="115" y="25" class="node-text-bold" text-anchor="middle">Schema Validation Tests</text>
    <text x="115" y="42" class="node-text" text-anchor="middle">test_resume_optimizer_schema.py</text>
    <text x="115" y="60" class="node-text" text-anchor="middle">Verifies ge/le range &amp; model copy</text>
  </g>

  <g transform="translate(1015, 835)">
    <rect width="250" height="85" rx="5" fill="#ffffff" stroke="#5d4037" stroke-width="1.5" />
    <text x="125" y="25" class="node-text-bold" text-anchor="middle">Repository Integration Tests</text>
    <text x="125" y="42" class="node-text" text-anchor="middle">test_resume_optimizer_service.py</text>
    <text x="125" y="60" class="node-text" text-anchor="middle">Validates SQLite mock persistence</text>
  </g>

  <!-- ==================== LEGEND ==================== -->
  <g transform="translate(1300, 800)">
    <text x="0" y="15" class="node-text-bold">LEGEND</text>
    <rect x="0" y="25" width="12" height="12" fill="#f0f9ff" stroke="#bae6fd" />
    <text x="20" y="35" class="legend-text">Blue = API / Client</text>

    <rect x="0" y="45" width="12" height="12" fill="#f0fdf4" stroke="#bbf7d0" />
    <text x="20" y="55" class="legend-text">Green = Services</text>

    <rect x="0" y="65" width="12" height="12" fill="#faf5ff" stroke="#e9d5ff" />
    <text x="20" y="75" class="legend-text">Purple = AI / Agents</text>

    <rect x="0" y="85" width="12" height="12" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="20" y="95" class="legend-text">Gray = Repositories / Testing</text>

    <rect x="0" y="105" width="12" height="12" fill="#fff7ed" stroke="#fed7aa" />
    <text x="20" y="115" class="legend-text">Orange = Database</text>
  </g>

</svg>
