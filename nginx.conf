# nginx.conf
# Production Nginx reverse proxy configuration with TLS termination & request routing

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression configurations
    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/javascript text/xml;

    upstream frontend_server {
        server frontend:3000;
    }

    upstream backend_server {
        server backend:8000;
    }

    # Redirect all HTTP requests to secure HTTPS connection
    server {
        listen 80;
        server_name jobcopilot.example.com;
        return 301 https://$host$request_uri;
    }

    # Secure HTTPS Server Block
    server {
        listen 443 ssl http2;
        server_name jobcopilot.example.com;

        # TLS Configuration
        ssl_certificate /etc/nginx/ssl/live/jobcopilot.example.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/jobcopilot.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Static assets files delivery optimization
        location /_next/static {
            proxy_pass http://frontend_server;
            proxy_cache_valid 200 60m;
            proxy_buffering on;
            expires 365d;
        }

        # Route traffic to FastAPI Backend API gateway
        location /api {
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Route generic traffic to Next.js Frontend server
        location / {
            proxy_pass http://frontend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
