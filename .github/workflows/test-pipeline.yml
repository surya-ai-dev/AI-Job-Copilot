name: Backend CI Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Run Backend Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: jobcopilot
          POSTGRES_PASSWORD: jobcopilot123
          POSTGRES_DB: jobcopilot_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U jobcopilot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+asyncpg://jobcopilot:jobcopilot123@localhost:5433/jobcopilot_db
      SECRET_KEY: secure-jwt-signing-secret-key-string-here
      ALLOWED_ORIGINS: '["http://localhost:3000"]'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Verify Python
        run: |
          python --version
          uv --version

      - name: Install Dependencies
        run: |
          uv pip install --system -r backend/requirements.txt

      # Temporary debug step
      - name: Verify Installed Packages
        run: |
          python -m pip show pdfplumber || true
          python -c "import pdfplumber; print('pdfplumber installed successfully')"

      - name: Show Requirements
        run: |
          echo "===== backend/requirements.txt ====="
          cat backend/requirements.txt

      - name: Run Alembic Migrations
        run: |
          alembic upgrade head

      - name: Run Pytest with Coverage
        run: |
          pytest backend/tests \
            --cov=backend.app \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml