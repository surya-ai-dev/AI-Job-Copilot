name: Backend CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    # Setup PostgreSQL service container with health checks
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: jobcopilot
          POSTGRES_PASSWORD: jobcopilot123
          POSTGRES_DB: jobcopilot_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
      - uses: actions/upload-artifact@v4
        with:
          python-version: "3.10"

      - name: Install uv package manager
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync dependencies using uv
        run: |
          uv pip install --system -r backend/requirements.txt

      - name: Run Alembic schema migrations
        env:
          DATABASE_URL: postgresql+asyncpg://jobcopilot:jobcopilot123@localhost:5433/jobcopilot_db
        run: |
          alembic upgrade head

      - name: Execute pytest test suite with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://jobcopilot:jobcopilot123@localhost:5433/jobcopilot_db
          SECRET_KEY: secure-jwt-signing-secret-key-string-here
          ALLOWED_ORIGINS: '["http://localhost:3000"]'
        run: |
          pytest --cov=backend/app --cov-report=xml backend/tests/

      - name: Upload code coverage reports
        uses: actions/download-artifact@v4
        with:
          name: code-coverage-report
          path: coverage.xml
