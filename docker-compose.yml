# docker-compose.yml
# Production docker-compose file orchestrating services, networks & volumes mounts

services:
  # 1. Reverse Proxy (Nginx)
  nginx:
    image: nginx:1.25-alpine
    container_name: proxy_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - jobcopilot_network
    restart: always

  # 2. Frontend Application (Next.js)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: app_frontend
    environment:
      - NEXT_PUBLIC_API_URL=https://jobcopilot.example.com/api/v1
    networks:
      - jobcopilot_network
    restart: always

  # 3. Backend Application (FastAPI)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: app_backend
    env_file:
      - .env
    volumes:
      - jobcopilot_storage:/app/storage
    depends_on:
      - jobcopilot_postgres
      - jobcopilot_redis
    networks:
      - jobcopilot_network
    restart: always

  # 4. Database (PostgreSQL)
  jobcopilot_postgres:
    image: postgres:15-alpine
    container_name: jobcopilot_postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=jobcopilot
      - POSTGRES_PASSWORD=jobcopilot123
      - POSTGRES_DB=jobcopilot_db
    volumes:
      - jobcopilot_postgres_data:/var/lib/postgresql/data
    networks:
      - jobcopilot_network
    restart: always

  # 5. Caching (Redis)
  jobcopilot_redis:
    image: redis:7-alpine
    container_name: jobcopilot_redis
    ports:
      - "6379:6379"
    networks:
      - jobcopilot_network
    restart: always

networks:
  jobcopilot_network:
    driver: bridge

volumes:
  jobcopilot_postgres_data:
  jobcopilot_storage:
